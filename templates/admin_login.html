<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Admin — Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #5b21b6, #7c3aed);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 40px;
    width: 360px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    text-align: center;
  }
  .icon { font-size: 3rem; margin-bottom: 12px; }
  h1 { font-size: 1.4rem; color: #1f2937; margin-bottom: 4px; }
  p { color: #6b7280; font-size: .9rem; margin-bottom: 24px; }
  input {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    font-size: 1rem;
    outline: none;
    transition: border-color .2s;
    margin-bottom: 12px;
  }
  input:focus { border-color: #7c3aed; }
  .error { color: #ef4444; font-size: .85rem; margin-bottom: 10px; }
  button {
    width: 100%;
    padding: 13px;
    background: #7c3aed;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: #5b21b6; }
  .back { display: block; margin-top: 14px; color: #7c3aed; text-decoration: none; font-size: .85rem; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔐</div>
  <h1>Painel Admin</h1>
  <p>Digite a senha para acessar o painel de gerenciamento.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST">
    <input type="password" name="password" placeholder="Senha" autofocus>
    <button type="submit">Entrar</button>
  </form>
  <a href="/" class="back">← Voltar ao Kiosk</a>
</div>
</body>
</html>
